name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the smoke test's Changes page reads full git history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Browser smoke test (fake model)
        run: |
          npx playwright-core install chromium
          export CHROME=$(find ~/.cache/ms-playwright -maxdepth 3 -type f -name chrome -path '*chromium-*' | head -1)
          LEARNFORGE_HOME=$(mktemp -d) LEARNFORGE_AGENT=fake node dist/cli.js . --port 4799 --no-open &
          sleep 3
          node test/ui-smoke.mjs --url http://127.0.0.1:4799
