name: release
on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write # required for npm trusted publishing (OIDC)
  contents: write # required to attach release notes to the GitHub Release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@^11.5.1 # trusted publishing needs npm >=11.5.1
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
      - name: Publish to npm
        run: |
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm publish; then
            exit 0
          fi
          echo "npm publish reported failure; checking whether it landed anyway"
          LIVE=$(npm view "$PKG@$VER" version 2>/dev/null || true)
          if [ "$LIVE" = "$VER" ]; then
            echo "$PKG@$VER is live on the registry despite the error (seen once as an internal retry conflict after a staged-version leftover) -- treating as success"
          else
            echo "$PKG@$VER is not live -- failing for real"
            exit 1
          fi
      - name: Extract this version's changelog section
        run: |
          awk '/^## /{if (p) exit; p=1; print; next} p' CHANGELOG.md > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: false
